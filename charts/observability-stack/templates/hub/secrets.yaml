{{- if eq .Values.mode "hub" }}
{{- $pw := include "obs.tenantPasswords" . | fromJson }}
# ---------------------------------------------------------------------------
# Tenant credentials (one key per tenant id). Consumed by Grafana datasources,
# k6 and the hub agent; hand each spoke only its own key.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: observability-tenant-credentials
  labels: {{- include "obs.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $id, $p := $pw }}
  {{ $id }}: {{ $p | b64enc | quote }}
  {{- end }}
---
# htpasswd for the gateway (username == tenant id). NGINX re-reads this file on
# every request, so rotating a password needs no restart.
apiVersion: v1
kind: Secret
metadata:
  name: observability-gateway-htpasswd
  labels: {{- include "obs.labels" . | nindent 4 }}
type: Opaque
stringData:
  .htpasswd: |
    {{- range $id, $p := $pw }}
    {{ htpasswd $id $p }}
    {{- end }}
---
# Local agent (hub self-monitoring) authenticates as agent.tenant.
apiVersion: v1
kind: Secret
metadata:
  name: observability-agent-auth
  labels: {{- include "obs.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ index $pw .Values.agent.tenant | default "" | b64enc | quote }}
{{- if .Values.minio.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: observability-object-storage
  labels: {{- include "obs.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  rootUser: {{ include "obs.stableSecretValue" (dict "root" . "secret" "observability-object-storage" "key" "rootUser" "length" 16) | lower | quote }}
  rootPassword: {{ include "obs.stableSecretValue" (dict "root" . "secret" "observability-object-storage" "key" "rootPassword") | quote }}
{{- end }}
{{- if .Values.grafana.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: observability-grafana-admin
  labels: {{- include "obs.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  admin-user: admin
  admin-password: {{ include "obs.stableSecretValue" (dict "root" . "secret" "observability-grafana-admin" "key" "admin-password") | quote }}
{{- end }}
{{- end }}
