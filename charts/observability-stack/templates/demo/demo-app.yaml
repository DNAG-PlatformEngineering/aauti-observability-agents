{{- if .Values.demoApp.enabled }}
# Small demo workload for local testing: nginx (access logs -> Loki) plus the
# NGINX Prometheus exporter (request metrics -> Mimir). Target for k6.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app
  labels: {{- include "obs.labels" . | nindent 4 }}
data:
  default.conf: |
    {{- include "obs.demoNginxConf" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    {{- include "obs.labels" . | nindent 4 }}
    app.kubernetes.io/name: demo-app
spec:
  replicas: {{ .Values.demoApp.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: demo-app }
  template:
    metadata:
      labels: { app.kubernetes.io/name: demo-app }
      annotations:
        # restart when the nginx config changes
        checksum/config: {{ include "obs.demoNginxConf" . | sha256sum | trunc 12 }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        observability.aauti.com/log-type: access
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.29-alpine
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http } }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d }
        - name: exporter
          image: docker.io/nginx/nginx-prometheus-exporter:1.4.2
          args: ["--nginx.scrape-uri=http://127.0.0.1:8080/stub_status"]
          ports: [{ name: http-metrics, containerPort: 9113 }]
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 32Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      volumes:
        - name: conf
          configMap: { name: demo-app }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  labels: {{- include "obs.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: demo-app }
  ports: [{ name: http, port: 80, targetPort: http }]
{{- end }}
