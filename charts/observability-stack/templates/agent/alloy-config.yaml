{{- if .Values.alloy.enabled }}
{{- $a := .Values.agent }}
{{- $hub := include "obs.hubUrl" . }}
{{- $tenant := $a.tenant }}
{{- $nsRegex := join "|" $a.namespaces }}
{{- $ksmSelector := default (printf "app.kubernetes.io/name=kube-state-metrics,app.kubernetes.io/instance=%s" .Release.Name) $a.metrics.kubeStateMetrics.selector }}
{{- $insecureHub := $a.tls.insecureSkipVerify }}
{{- $caFile := "/etc/observability/hub-ca/ca.crt" }}
{{- /* DaemonSet: every agent only handles its own node; KSM is split with clustering. */}}
{{- $ds := eq .Values.alloy.controller.type "daemonset" }}
{{- /* Per-namespace environment: every series / stream passes a relabel stage
     that derives `environment` from the namespace (see agent.environmentFromNamespace). */}}
{{- $envNs := $a.environmentFromNamespace.enabled }}
{{- $mout := ternary "prometheus.relabel.environment.receiver" "prometheus.remote_write.hub.receiver" $envNs }}
{{- /* Optional per-line environment (e.g. from a meeting room name in the line):
     ... -> loki.relabel.environment -> loki.process.line_environment -> loki.write */}}
{{- $lineEnv := $a.logs.environmentFromLine.enabled }}
{{- /* Optional `env` alias of the final `environment`: a constant external label
     when environment is per cluster, else copied by a last relabel stage
     (logs: loki.relabel.env_alias right before loki.write). A per-line environment
     also needs the copy; the stream's env then overrides the external label. */}}
{{- $envAlias := $a.envLabel.enabled }}
{{- $envCopy := and $envAlias (or $envNs $lineEnv) }}
{{- $lfinal := ternary "loki.relabel.env_alias.receiver" "loki.write.hub.receiver" $envCopy }}
{{- $lwrite := ternary "loki.process.line_environment.receiver" $lfinal $lineEnv }}
{{- $lout := ternary "loki.relabel.environment.receiver" $lwrite $envNs }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.agent.configMapName }}
  labels: {{- include "obs.labels" . | nindent 4 }}
data:
  config.alloy: |
    // Generated by the observability-stack chart (mode={{ .Values.mode }}).
    // cluster={{ .Values.cluster.name }} environment={{ .Values.cluster.environment }} tenant={{ $tenant }}

    logging {
      level  = "info"
      format = "logfmt"
    }

    // =====================================================================
    // Discovery
    // =====================================================================
    discovery.kubernetes "pods" {
      role = "pod"
      {{- include "obs.alloyNamespaces" . | indent 4 }}
      {{- if $ds }}
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("HOSTNAME")
      }
      {{- end }}
    }

    // Common pod -> label mapping shared by metrics and logs.
    discovery.relabel "pod_labels" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
      // app = app.kubernetes.io/name | app | controller name
      rule {
        source_labels = ["__meta_kubernetes_pod_controller_name"]
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex         = "(.+)"
        target_label  = "app"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex         = "(.+)"
        target_label  = "app"
      }
    }

    {{- if $a.metrics.enabled }}

    // =====================================================================
    // Metrics
    // =====================================================================
    prometheus.remote_write "hub" {
      endpoint {
        url     = "{{ $hub }}/api/v1/push"
        headers = { "X-Scope-OrgID" = "{{ $tenant }}" }
        basic_auth {
          username = "{{ $tenant }}"
          password = sys.env("HUB_PASSWORD")
        }
        tls_config {
          {{- if $insecureHub }}
          insecure_skip_verify = true
          {{- else }}
          ca_file = "{{ $caFile }}"
          {{- end }}
          {{- with $a.tls.serverName }}
          server_name = "{{ . }}"
          {{- end }}
        }
      }
      external_labels = {
        cluster     = "{{ .Values.cluster.name }}",
        {{- if not $envNs }}
        environment = "{{ .Values.cluster.environment }}",
        {{- if $envAlias }}
        env         = "{{ .Values.cluster.environment }}",
        {{- end }}
        {{- end }}
        {{- with .Values.cluster.tier }}
        tier        = "{{ . }}",
        {{- end }}
        {{- with .Values.cluster.product }}
        product     = "{{ . }}",
        {{- end }}
      }
    }

    {{- if $envNs }}

    // environment = namespace suffix (e.g. aauti-api-qa -> qa), otherwise the
    // cluster default (namespace-less series such as node metrics included).
    prometheus.relabel "environment" {
      forward_to = [prometheus.remote_write.hub.receiver]
      rule {
        source_labels = ["namespace"]
        regex         = "{{ $a.environmentFromNamespace.regex }}"
        replacement   = "$1"
        target_label  = "environment"
      }
      rule {
        source_labels = ["environment"]
        regex         = ""
        replacement   = "{{ .Values.cluster.environment }}"
        target_label  = "environment"
      }
      {{- if $envCopy }}
      // env = final environment (agent.envLabel)
      rule {
        source_labels = ["environment"]
        target_label  = "env"
      }
      {{- end }}
    }
    {{- end }}

    {{- if $a.metrics.annotatedPods }}

    // Pods annotated prometheus.io/scrape="true".
    discovery.relabel "annotated_pods" {
      targets = discovery.relabel.pod_labels.output

      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        regex         = "true"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Pending|Succeeded|Failed|Unknown"
        action        = "drop"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_init"]
        regex         = "true"
        action        = "drop"
      }
      // With prometheus.io/port: any port target (they collapse into one after
      // the address rewrite below). Without it: only ports named *metrics.
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_container_port_name"]
        separator     = ";"
        regex         = "\\d+;.*|;.*metrics"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scheme"]
        regex         = "(https?)"
        target_label  = "__scheme__"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_ip", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
        separator     = ";"
        regex         = "(.+);(\\d+)"
        replacement   = "$1:$2"
        target_label  = "__address__"
      }
      rule {
        source_labels = ["namespace", "app"]
        separator     = "/"
        target_label  = "job"
      }
      // one target per pod, not per container
      rule {
        regex  = "container"
        action = "labeldrop"
      }
    }

    prometheus.scrape "annotated_pods" {
      targets         = discovery.relabel.annotated_pods.output
      scrape_interval = "{{ $a.metrics.scrapeInterval }}"
      forward_to      = [{{ $mout }}]
    }
    {{- end }}

    {{- if $a.metrics.kubelet.enabled }}

    // Kubelet + cAdvisor, scraped directly from every node (nodes/metrics RBAC).
    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.relabel "nodes" {
      targets = discovery.kubernetes.nodes.targets
      {{- if $ds }}
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = sys.env("HOSTNAME")
        action        = "keep"
      }
      {{- end }}
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "instance"
      }
    }

    prometheus.scrape "cadvisor" {
      targets           = discovery.relabel.nodes.output
      job_name          = "integrations/kubernetes/cadvisor"
      scheme            = "https"
      metrics_path      = "/metrics/cadvisor"
      scrape_interval   = "{{ $a.metrics.scrapeInterval }}"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = {{ $a.metrics.kubelet.insecureSkipVerify }}
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }
      forward_to = [prometheus.relabel.cadvisor.receiver]
    }

    prometheus.relabel "cadvisor" {
      forward_to = [{{ $mout }}]
      rule {
        source_labels = ["__name__"]
        regex         = "up|container_cpu_usage_seconds_total|container_cpu_cfs_throttled_periods_total|container_cpu_cfs_periods_total|container_memory_working_set_bytes|container_memory_rss|container_memory_cache|container_network_receive_bytes_total|container_network_transmit_bytes_total|container_network_receive_packets_dropped_total|container_network_transmit_packets_dropped_total|container_fs_reads_bytes_total|container_fs_writes_bytes_total|container_oom_events_total|machine_cpu_cores|machine_memory_bytes"
        action        = "keep"
      }
      // drop cgroup-level duplicates without a container (except network which is pod-level)
      rule {
        source_labels = ["__name__", "container"]
        separator     = "@"
        regex         = "container_(cpu|memory|fs|oom).*@"
        action        = "drop"
      }
      rule {
        source_labels = ["container"]
        regex         = "POD"
        action        = "drop"
      }
      {{- if $a.namespaces }}
      rule {
        source_labels = ["__name__", "namespace"]
        separator     = "@"
        regex         = "(up|machine_.*)@.*|.*@({{ $nsRegex }})"
        action        = "keep"
      }
      {{- end }}
    }

    prometheus.scrape "kubelet" {
      targets           = discovery.relabel.nodes.output
      job_name          = "integrations/kubernetes/kubelet"
      scheme            = "https"
      scrape_interval   = "{{ $a.metrics.scrapeInterval }}"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        insecure_skip_verify = {{ $a.metrics.kubelet.insecureSkipVerify }}
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }
      forward_to = [prometheus.relabel.kubelet.receiver]
    }

    prometheus.relabel "kubelet" {
      forward_to = [{{ $mout }}]
      rule {
        source_labels = ["__name__"]
        regex         = "up|kubelet_running_pods|kubelet_running_containers|kubelet_node_name|kubelet_volume_stats_(capacity|used|available)_bytes|kubelet_pod_start_duration_seconds_(count|sum)|kubernetes_build_info"
        action        = "keep"
      }
    }
    {{- end }}

    {{- if $a.metrics.kubeStateMetrics.enabled }}

    // kube-state-metrics (cluster health: pods, deployments, nodes, ...).
    discovery.kubernetes "ksm" {
      role = "pod"
      selectors {
        role  = "pod"
        label = "{{ $ksmSelector }}"
      }
    }

    discovery.relabel "ksm" {
      targets = discovery.kubernetes.ksm.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_name"]
        regex         = "http|http-metrics"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "instance"
      }
    }

    prometheus.scrape "ksm" {
      targets         = discovery.relabel.ksm.output
      job_name        = "integrations/kubernetes/kube-state-metrics"
      honor_labels    = true
      scrape_interval = "{{ $a.metrics.scrapeInterval }}"
      forward_to      = [{{ $mout }}]
      {{- if $ds }}
      clustering {
        enabled = true
      }
      {{- end }}
    }
    {{- end }}

    {{- if $a.metrics.nodeExporter.enabled }}

    // node-exporter (node CPU / memory / disk / network).
    discovery.kubernetes "node_exporter" {
      role = "pod"
      selectors {
        role  = "pod"
        label = "{{ $a.metrics.nodeExporter.selector }}"
        {{- if $ds }}
        field = "spec.nodeName=" + sys.env("HOSTNAME")
        {{- end }}
      }
    }

    discovery.relabel "node_exporter" {
      targets = discovery.kubernetes.node_exporter.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_number"]
        regex         = "9100"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "instance"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label  = "node"
      }
    }

    prometheus.scrape "node_exporter" {
      targets         = discovery.relabel.node_exporter.output
      job_name        = "integrations/node_exporter"
      scrape_interval = "{{ $a.metrics.scrapeInterval }}"
      forward_to      = [prometheus.relabel.node_exporter.receiver]
    }

    prometheus.relabel "node_exporter" {
      forward_to = [{{ $mout }}]
      rule {
        source_labels = ["__name__"]
        regex         = "up|node_(cpu_seconds_total|load1|load5|load15|memory_MemTotal_bytes|memory_MemAvailable_bytes|filesystem_size_bytes|filesystem_avail_bytes|network_receive_bytes_total|network_transmit_bytes_total|disk_read_bytes_total|disk_written_bytes_total|disk_io_time_seconds_total|boot_time_seconds|uname_info)"
        action        = "keep"
      }
      rule {
        source_labels = ["fstype"]
        regex         = "tmpfs|overlay|squashfs|nsfs"
        action        = "drop"
      }
    }
    {{- end }}

    {{- with $a.metrics.prometheusOperator }}
    {{- if .enabled }}

    // Targets of existing Prometheus Operator ServiceMonitors / PodMonitors
    // (the monitor objects are only read, never modified).
    {{- range $kind := list "servicemonitors" "podmonitors" }}
    prometheus.operator.{{ $kind }} "operator" {
      forward_to = [{{ $mout }}]
      {{- with $.Values.agent.metrics.prometheusOperator.namespaces }}
      namespaces = {{ . | toJson }}
      {{- end }}
      {{- with $.Values.agent.metrics.prometheusOperator.matchExpressions }}
      selector {
        {{- range . }}
        match_expression {
          key      = {{ .key | quote }}
          operator = {{ .operator | quote }}
          {{- with .values }}
          values   = {{ . | toJson }}
          {{- end }}
        }
        {{- end }}
      }
      {{- end }}
      {{- if $ds }}
      clustering {
        enabled = true
      }
      {{- end }}
    }
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}

    {{- if $a.logs.enabled }}

    // =====================================================================
    // Logs
    // =====================================================================
    loki.write "hub" {
      endpoint {
        url       = "{{ $hub }}/loki/api/v1/push"
        tenant_id = "{{ $tenant }}"
        basic_auth {
          username = "{{ $tenant }}"
          password = sys.env("HUB_PASSWORD")
        }
        tls_config {
          {{- if $insecureHub }}
          insecure_skip_verify = true
          {{- else }}
          ca_file = "{{ $caFile }}"
          {{- end }}
          {{- with $a.tls.serverName }}
          server_name = "{{ . }}"
          {{- end }}
        }
      }
      external_labels = {
        cluster     = "{{ .Values.cluster.name }}",
        {{- if not $envNs }}
        environment = "{{ .Values.cluster.environment }}",
        {{- if $envAlias }}
        env         = "{{ .Values.cluster.environment }}",
        {{- end }}
        {{- end }}
        {{- with .Values.cluster.tier }}
        tier        = "{{ . }}",
        {{- end }}
        {{- with .Values.cluster.product }}
        product     = "{{ . }}",
        {{- end }}
      }
    }

    {{- if $envNs }}

    // environment = namespace suffix (e.g. aauti-api-qa -> qa), otherwise the
    // cluster default (namespace-less series such as node metrics included).
    loki.relabel "environment" {
      forward_to = [{{ $lwrite }}]
      rule {
        source_labels = ["namespace"]
        regex         = "{{ $a.environmentFromNamespace.regex }}"
        replacement   = "$1"
        target_label  = "environment"
      }
      rule {
        source_labels = ["environment"]
        regex         = ""
        replacement   = "{{ .Values.cluster.environment }}"
        target_label  = "environment"
      }
    }
    {{- end }}

    {{- if $lineEnv }}

    // Lines that name their own environment (regex group "env") get it as the
    // `environment` label; all other lines keep the namespace / cluster value.
    loki.process "line_environment" {
      forward_to = [{{ $lfinal }}]
      stage.regex {
        expression = {{ $a.logs.environmentFromLine.regex | quote }}
      }
      stage.labels {
        values = { environment = "env" }
      }
    }
    {{- end }}

    {{- if $envCopy }}

    // env = final environment (agent.envLabel), after any per-line override.
    loki.relabel "env_alias" {
      forward_to = [loki.write.hub.receiver]
      rule {
        source_labels = ["environment"]
        target_label  = "env"
      }
    }
    {{- end }}

    discovery.relabel "pod_logs" {
      targets = discovery.relabel.pod_labels.output

      // log_type drives per-type retention on the hub
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_observability_aauti_com_log_type"]
        regex         = ""
        replacement   = "{{ $a.logs.defaultLogType }}"
        target_label  = "log_type"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_observability_aauti_com_log_type"]
        regex         = "(.+)"
        target_label  = "log_type"
      }
      rule {
        source_labels = ["namespace", "app"]
        separator     = "/"
        target_label  = "job"
      }
      {{- if eq $a.logs.method "file" }}
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }
      {{- end }}
    }

    {{- if eq $a.logs.method "file" }}

    local.file_match "pod_logs" {
      path_targets = discovery.relabel.pod_logs.output
    }

    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.process.pod_logs.receiver]
    }

    loki.process "pod_logs" {
      stage.cri {}
      forward_to = [{{ $lout }}]
    }
    {{- else }}

    loki.source.kubernetes "pod_logs" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [{{ $lout }}]
    }
    {{- end }}

    {{- if $a.logs.events }}

    loki.source.kubernetes_events "events" {
      job_name   = "integrations/kubernetes/eventhandler"
      log_format = "logfmt"
      {{- if $a.namespaces }}
      namespaces = {{ $a.namespaces | toJson }}
      {{- end }}
      forward_to = [loki.process.events.receiver]
    }

    loki.process "events" {
      stage.static_labels {
        values = { log_type = "k8s-event" }
      }
      forward_to = [{{ $lout }}]
    }
    {{- end }}
    {{- end }}
{{- if eq .Values.mode "spoke" }}
{{- if not .Values.agent.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.agent.auth.secretName }}
  labels: {{- include "obs.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.agent.auth.password | b64enc | quote }}
{{- end }}
{{- if .Values.agent.tls.caCert }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.agent.tls.caSecretName }}
  labels: {{- include "obs.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ .Values.agent.tls.caCert | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
