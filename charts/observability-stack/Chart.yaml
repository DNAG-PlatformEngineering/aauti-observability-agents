apiVersion: v2
name: observability-stack
description: >-
  Centralized Grafana observability stack for a hub-and-spoke Kubernetes estate.
  One chart, two modes: "hub" deploys multi-tenant Loki + Mimir behind an
  authenticating TLS gateway, Grafana (datasources, dashboards, alerts, RBAC as
  code) and k6 load tests; "spoke" deploys a Grafana Alloy agent that ships
  logs and metrics to the hub under the spoke's own tenant.
type: application
version: 0.1.0
appVersion: "1.0.0"
kubeVersion: ">=1.27.0-0"
keywords: [observability, grafana, loki, mimir, alloy, k6, multi-tenant]

dependencies:
  # ---------------- hub components ----------------
  - name: loki
    version: 7.3.0
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled
  - name: mimir-distributed
    alias: mimir
    version: 6.2.0
    repository: https://grafana.github.io/helm-charts
    condition: mimir.enabled
  - name: grafana
    version: 10.5.15
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
  - name: minio
    version: 5.4.0
    repository: https://charts.min.io/
    condition: minio.enabled
  # ---------------- agent components (hub + spoke) ----------------
  - name: alloy
    version: 1.12.1
    repository: https://grafana.github.io/helm-charts
    condition: alloy.enabled
  - name: kube-state-metrics
    version: 8.5.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-state-metrics.enabled
