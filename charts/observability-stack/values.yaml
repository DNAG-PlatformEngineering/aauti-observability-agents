# =============================================================================
# observability-stack — default values
#
# One chart, two modes:
#   mode: hub    -> Loki + Mimir (multi-tenant) + auth gateway (TLS) + Grafana
#                   + object storage + k6 + a local Alloy agent ("platform" tenant)
#   mode: spoke  -> Alloy agent + kube-state-metrics, shipping to the hub
#
# Layering (see README.md):
#   values.yaml                     <- this file: every knob, documented
#   profiles/hub.yaml | spoke.yaml  <- turns the right sub-charts on
#   environments/<env>/<name>.yaml  <- per cluster / per tenant settings
#
# NOTE on fixed resource names: several Secrets/ConfigMaps created by this
# chart have fixed names (prefix "observability-") because sub-chart values
# (Alloy, Grafana, Loki, Mimir) cannot reference parent templates. Do not run
# two releases of this chart in the same namespace.
# =============================================================================

# -- "hub" or "spoke".
mode: hub

# -- Identity of the cluster this release is installed in. Attached as the
# `cluster` and `environment` labels to every metric and log line so data can
# be filtered in Grafana even inside a tenant.
cluster:
  name: hub
  # -- The cluster's environment. With agent.environmentFromNamespace enabled
  # it is only the default for namespaces without an environment suffix.
  environment: nonprod
  # -- Optional `tier` label on everything (prod | nonprod). Empty = not added.
  tier: ""
  # -- Optional `product` label on everything (e.g. media, jitsi). Lets one
  # federated datasource filter by product across tenants. Empty = not added.
  product: ""

# =============================================================================
# AGENT (both modes) — what the local Alloy collects and where it sends it
# =============================================================================
agent:
  # -- Tenant this cluster writes to. Spokes: their own tenant (media,
  # application, jitsi, ...). Hub: the "platform" tenant (hub self-monitoring).
  tenant: platform

  # -- Hub gateway base URL (no trailing slash). Leave empty in hub mode to use
  # the in-cluster gateway Service.
  hubUrl: ""

  auth:
    # -- Password of `agent.tenant` on the hub gateway (spoke mode). Ignored in
    # hub mode (taken from the generated tenant credentials).
    password: ""
    # -- Use a pre-created Secret instead (named `secretName`, key
    # `password`). Recommended for production.
    existingSecret: false
    # -- Name of that Secret. When changed, also set the alloy sub-chart's
    # HUB_PASSWORD secretKeyRef (alloy.alloy.extraEnv) to the same name.
    secretName: observability-agent-auth

  tls:
    # -- PEM CA bundle that signed the hub gateway certificate (spoke mode).
    # Hub mode uses the chart generated / provided CA automatically.
    caCert: ""
    # -- Name of the Secret holding caCert (spoke mode). When changed, also set
    # the alloy sub-chart's hub-ca volume (alloy.controller.volumes.extra).
    caSecretName: observability-hub-ca
    # -- Skip verification of the hub certificate. Never in production.
    insecureSkipVerify: false
    # -- Host name to verify the hub certificate against (TLS SNI) when
    # `hubUrl` is an IP address, e.g. the hub's internal load balancer
    # reached over VPC peering. Must be a SAN of the gateway certificate.
    serverName: ""

  # -- Derive the `environment` label per namespace instead of per cluster, for
  # clusters that host several environments (aauti-api-dev, aauti-api-qa, ...).
  # A namespace matching `regex` gets capture group 1 as environment; every
  # other series / stream (other namespaces, node metrics) gets
  # cluster.environment (unless the series already carries an `environment`
  # label of its own).
  environmentFromNamespace:
    enabled: false
    regex: "(?:.*-)?(dev|qa|demo|sandbox|uat|staging)"

  # -- Also send the final `environment` value as `env` (a shorter alias; same
  # value, including per-line environments). `environment` is kept.
  envLabel:
    enabled: false

  # -- Name of the ConfigMap with the generated Alloy config. When changed,
  # also set alloy.alloy.configMap.name to the same name.
  configMapName: observability-agent-config

  # -- Restrict collection to these namespaces (empty = whole cluster). Used
  # locally to simulate several spoke clusters inside one Kubernetes cluster.
  namespaces: []

  metrics:
    enabled: true
    scrapeInterval: 60s
    # -- Scrape pods annotated `prometheus.io/scrape: "true"`
    # (+ optional prometheus.io/port, prometheus.io/path, prometheus.io/scheme).
    annotatedPods: true
    # -- cAdvisor + kubelet metrics straight from each node's kubelet (:10250).
    kubelet:
      enabled: true
      # Kubelet serving certs are usually self-signed.
      insecureSkipVerify: true
    kubeStateMetrics:
      enabled: true
      # -- Label selector used to find kube-state-metrics pods. Default finds
      # the instance deployed by this release.
      selector: ""
    nodeExporter:
      # -- Scrape node-exporter pods found by `selector` (anywhere in the
      # cluster). Deploy node-exporter separately if the cluster has none.
      enabled: true
      selector: app.kubernetes.io/name=prometheus-node-exporter
    # -- Also scrape the targets of existing Prometheus Operator
    # ServiceMonitors / PodMonitors (needs the monitoring.coreos.com CRDs).
    # Useful when an application chart ships monitors but no
    # prometheus.io/scrape annotations. Only the monitor objects are read.
    prometheusOperator:
      enabled: false
      # -- Namespaces whose monitors are used (empty = all namespaces).
      namespaces: []
      # -- Monitor label selector, e.g. to skip a monitor whose pods are
      # already scraped through annotations:
      #   - { key: app.kubernetes.io/component, operator: NotIn, values: [jvb] }
      matchExpressions: []

  logs:
    enabled: true
    # -- "api": tail logs through the Kubernetes API (works as a Deployment,
    # no host mounts). "file": tail /var/log/pods on every node (requires
    # alloy.controller.type=daemonset and alloy.alloy.mounts.varlog=true);
    # preferred for very high log volumes.
    method: api
    # -- Ship Kubernetes events as logs (log_type="k8s-event").
    events: true
    # -- Take `environment` from the log line itself when one shared workload
    # serves several environments (e.g. one Jitsi for dev/qa/demo/sandbox, the
    # environment being part of the meeting room name). `regex` is RE2 and must
    # contain a named group `env`; non-matching lines keep their environment.
    environmentFromLine:
      enabled: false
      regex: ""
    # -- Default value of the `log_type` label. Override per pod with the
    # annotation `observability.aauti.com/log-type: <type>`; retention can be
    # set per log_type on the hub (tenants.<t>.logs.streamRetention).
    defaultLogType: application

# =============================================================================
# HUB — tenants
#
# Every key under `tenants` becomes:
#   * a gateway user (username == tenant id) with a generated password
#   * an X-Scope-OrgID tenant in Loki and Mimir with its own limits/retention
#   * Grafana datasources "Loki – <Title>" / "Mimir – <Title>"
#   * a Grafana team + folder with that tenant's dashboards
# See docs/tenant-onboarding.md to add one.
# =============================================================================
tenants:
  platform:
    title: Platform
    # -- Leave empty to auto-generate (kept stable across upgrades).
    password: ""
    dashboards: [cluster-health, resource-usage, workloads-logs, tenant-usage]
    logs:
      retention: 336h            # 14d
      streamRetention: []
      limits:
        ingestion_rate_mb: 10
        ingestion_burst_size_mb: 20
        max_global_streams_per_user: 5000
    metrics:
      retention: 720h            # 30d
      limits:
        ingestion_rate: 50000
        ingestion_burst_size: 500000
        max_global_series_per_user: 300000

# -- Grafana team access granted to each tenant folder: View | Edit | Admin.
tenantFolderPermission: View

# =============================================================================
# HUB — authenticating gateway (NGINX) in front of Loki and Mimir
# =============================================================================
gateway:
  enabled: false
  replicas: 1
  # -- Read-only user that queries ALL tenants at once (Loki / Mimir tenant
  # federation), for a single Grafana datasource per signal. Its X-Scope-OrgID
  # is set by the gateway to every tenant id joined with "|"; push endpoints
  # return 403 for it. Its password is generated like a tenant's and stored in
  # observability-tenant-credentials under `username`. Needs Loki
  # querier.multi_tenant_queries_enabled and Mimir tenant_federation.enabled.
  reader:
    enabled: false
    username: grafana-reader
  image:
    repository: docker.io/nginxinc/nginx-unprivileged
    tag: 1.29-alpine
    pullPolicy: IfNotPresent
  service:
    # -- ClusterIP for local; LoadBalancer (internal) or use `ingress` for real spokes.
    type: ClusterIP
    port: 443
    annotations: {}
    loadBalancerSourceRanges: []
  ingress:
    # -- TLS-passthrough is NOT required: the gateway terminates TLS itself,
    # the ingress (if any) must forward HTTPS (backend-protocol: HTTPS).
    enabled: false
    className: ""
    annotations: {}
    host: observability.example.com
  tls:
    # -- Name of an existing kubernetes.io/tls Secret (e.g. from cert-manager)
    # that also contains `ca.crt`. When empty the chart generates a private CA
    # and server certificate (persisted across upgrades).
    existingSecret: ""
    # -- PEM of the CA that issued `existingSecret` / the cert-manager
    # certificate. Distributed to Grafana, k6 and the hub agent.
    caCert: ""
    # -- Extra DNS names for the generated certificate (public host names).
    extraDnsNames: []
    extraIpAddresses: []
    validityDays: 825
    certManager:
      # -- Issue the certificate with cert-manager instead of generating it.
      enabled: false
      issuerRef:
        kind: ClusterIssuer
        name: ""
  # -- Where to proxy to (templated; must be FQDNs because NGINX resolves them
  # at request time). Defaults match the sub-chart fullnameOverrides below.
  # For Loki SimpleScalable use loki-write / loki-read.
  upstreams:
    lokiWrite: "http://loki.{{ .Release.Namespace }}.svc.cluster.local:3100"
    lokiRead: "http://loki.{{ .Release.Namespace }}.svc.cluster.local:3100"
    mimirWrite: "http://mimir-distributor.{{ .Release.Namespace }}.svc.cluster.local:8080"
    mimirRead: "http://mimir-query-frontend.{{ .Release.Namespace }}.svc.cluster.local:8080"
  clientMaxBodySize: 50m
  # -- DNS server NGINX uses to resolve upstreams. Empty = the kube-dns
  # Service IP looked up from the cluster at install time (falls back to its
  # host name when rendering offline).
  resolver: ""
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 128Mi }

# -- nodeSelector / tolerations for the chart's own workloads (gateway,
# MinIO bucket Job, k6 CronJobs, grafana-access Job). Sub-charts take their own settings.
scheduling:
  nodeSelector: {}
  tolerations: []

# -- Restrict ingress to Loki / Mimir / MinIO pods to the hub namespace so
# that everything outside must go through the authenticating gateway.
networkPolicy:
  enabled: true

# =============================================================================
# HUB — k6 load testing (results remote-written to Mimir, tenant `k6.tenant`)
# =============================================================================
k6:
  enabled: false
  image:
    repository: docker.io/grafana/k6
    tag: 1.3.0
  # -- Tenant that receives k6 results (must exist in `tenants`).
  tenant: loadtest
  # -- Each test becomes a CronJob (suspended by default). Run on demand with:
  #   kubectl create job --from=cronjob/k6-<name> k6-<name>-manual
  tests: {}
  #  smoke-application:
  #    schedule: "0 2 * * *"
  #    suspend: true
  #    script: smoke.js               # file under files/k6/ or inline `scriptContent`
  #    env:
  #      TARGET_URL: http://demo-app.spoke-application.svc
  #      VUS: "10"
  #      DURATION: 2m
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

# =============================================================================
# HUB — Grafana access control (bootstrap Job using the Grafana HTTP API)
# =============================================================================
grafanaAccess:
  enabled: false
  # -- How tenants are separated inside Grafana:
  #   folders: one org; each tenant team only sees its own dashboard folder.
  #            (Grafana OSS cannot hide datasources, so a determined user can
  #            still query another tenant's datasource through the API.)
  #   orgs:    each tenant also gets its own Grafana organisation holding only
  #            its datasources + dashboards; tenant users are members of their
  #            tenant org(s) only. Platform users/Admins keep the main org,
  #            which still has everything.
  isolation: folders
  image:
    repository: docker.io/library/python
    tag: 3.13-alpine
  # -- Local Grafana users. Passwords are generated into the Secret
  # `observability-grafana-users` (key = login) unless `password` is given.
  # orgRole: Viewer | Editor | Admin. `teams` = tenant ids.
  users: []
  #  - login: media-viewer
  #    email: media-viewer@example.com
  #    orgRole: Viewer
  #    teams: [media]

# -- Extra Grafana alerting provisioning (contactPoints / policies), rendered
# verbatim next to the generated per-tenant usage alert rules.
alerting:
  enabled: false
  # -- Folder that holds the generated tenant-usage alert rules.
  folder: Platform
  # -- Warn when a tenant uses more than this fraction of a limit.
  usageThreshold: 0.8
  # -- Override the pending period ("for") of every generated rule, e.g. 1m
  # for local testing. Empty keeps the per-rule defaults (5m / 10m).
  pendingPeriod: ""
  # -- Shortcut: send every alert to one webhook (Slack/Teams/Google Chat
  # incoming-webhook bridges, PagerDuty/Opsgenie webhooks, ...). Creates the
  # contact point "platform-webhook" and makes it the default route.
  webhook:
    url: ""
  # -- Full Grafana provisioning format, for anything beyond one webhook
  # (email, Slack app, per-tenant routing). See docs/multi-tenancy.md.
  contactPoints: []
  policies: []

# =============================================================================
# Local demo workload (a spoke's "application"): nginx + exporter
# =============================================================================
demoApp:
  enabled: false
  replicas: 1

# -- Local only: tiny HTTP receiver that prints every alert notification it
# gets (kubectl logs deploy/alert-sink). Pair with alerting.webhook.url.
demoAlertSink:
  enabled: false

# =============================================================================
# SUB-CHARTS. Enabled by profiles/hub.yaml or profiles/spoke.yaml.
# Everything below is passed through to the upstream charts.
# =============================================================================

# ---------------------------------------------------------------- Loki -------
loki:
  enabled: false
  fullnameOverride: loki
  deploymentMode: SingleBinary
  # Namespaced RBAC: no cluster-scoped objects, so the hub can coexist with
  # other Loki installs in the same cluster.
  rbac: { namespaced: true }
  loki:
    auth_enabled: true            # multi-tenant: X-Scope-OrgID required
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index: { prefix: index_, period: 24h }
    storage:
      type: s3
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
        admin: loki-admin
      s3:
        endpoint: observability-minio:9000
        accessKeyId: ${OBJECT_STORE_ACCESS_KEY}
        secretAccessKey: ${OBJECT_STORE_SECRET_KEY}
        s3ForcePathStyle: true
        insecure: true
    limits_config:
      # Defaults for tenants without overrides.
      retention_period: 168h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_cache_freshness_per_query: 10m
      split_queries_by_interval: 15m
      volume_enabled: true
      discover_log_levels: true
      allow_structured_metadata: true
    compactor:
      retention_enabled: true
      delete_request_store: s3
      working_directory: /var/loki/compactor
      compaction_interval: 10m
      retention_delete_delay: 2h
    structuredConfig:
      # Per-tenant limits/retention live in the ConfigMap rendered by this
      # chart from `tenants` (templates/hub/tenant-overrides.yaml).
      runtime_config:
        file: /etc/loki/tenant-overrides/overrides.yaml
        period: 10s
  singleBinary:
    replicas: 1
    extraArgs: ["-config.expand-env=true"]
    extraEnv:
      - name: OBJECT_STORE_ACCESS_KEY
        valueFrom: { secretKeyRef: { name: observability-object-storage, key: rootUser } }
      - name: OBJECT_STORE_SECRET_KEY
        valueFrom: { secretKeyRef: { name: observability-object-storage, key: rootPassword } }
    extraVolumes:
      - name: tenant-overrides
        configMap: { name: observability-loki-overrides }
    extraVolumeMounts:
      - name: tenant-overrides
        mountPath: /etc/loki/tenant-overrides
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3100"
    persistence:
      size: 5Gi
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { memory: 1Gi }
  # Components not used in SingleBinary mode / replaced by this chart.
  write: { replicas: 0 }
  read: { replicas: 0 }
  backend: { replicas: 0 }
  gateway: { enabled: false }
  ruler: { enabled: false }
  lokiCanary: { enabled: false }
  test: { enabled: false }
  chunksCache: { enabled: false }
  resultsCache: { enabled: false }
  minio: { enabled: false }

# --------------------------------------------------------------- Mimir -------
mimir:
  enabled: false
  fullnameOverride: mimir
  mimir:
    structuredConfig:
      # Classic architecture (no Kafka). Enable ingest_storage + kafka for
      # large production installs.
      ingest_storage:
        enabled: false
      ingester:
        push_grpc_method_enabled: true
        ring:
          replication_factor: 1
      common:
        storage:
          backend: s3
          s3:
            endpoint: observability-minio:9000
            insecure: true
            access_key_id: ${OBJECT_STORE_ACCESS_KEY}
            secret_access_key: ${OBJECT_STORE_SECRET_KEY}
      blocks_storage:
        s3: { bucket_name: mimir-blocks }
      ruler_storage:
        s3: { bucket_name: mimir-ruler }
      alertmanager_storage:
        s3: { bucket_name: mimir-alertmanager }
      limits:
        # Defaults for tenants without overrides.
        compactor_blocks_retention_period: 168h
        max_global_series_per_user: 150000
      compactor:
        deletion_delay: 2h
      runtime_config:
        file: /etc/mimir/tenant-overrides/overrides.yaml
        period: 10s
  global:
    extraEnv:
      - name: OBJECT_STORE_ACCESS_KEY
        valueFrom: { secretKeyRef: { name: observability-object-storage, key: rootUser } }
      - name: OBJECT_STORE_SECRET_KEY
        valueFrom: { secretKeyRef: { name: observability-object-storage, key: rootPassword } }
    extraVolumes:
      - name: tenant-overrides
        configMap: { name: observability-mimir-overrides }
    extraVolumeMounts:
      - name: tenant-overrides
        mountPath: /etc/mimir/tenant-overrides
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
  kafka: { enabled: false }
  minio: { enabled: false }
  gateway: { enabled: false }
  rollout_operator: { enabled: false }
  alertmanager: { enabled: false }
  ruler: { enabled: false }
  distributor:
    replicas: 1
    resources: { requests: { cpu: 100m, memory: 128Mi } }
  ingester:
    replicas: 1
    zoneAwareReplication: { enabled: false }
    persistentVolume: { size: 5Gi }
    resources: { requests: { cpu: 100m, memory: 256Mi } }
  store_gateway:
    replicas: 1
    zoneAwareReplication: { enabled: false }
    persistentVolume: { size: 2Gi }
    resources: { requests: { cpu: 50m, memory: 128Mi } }
  compactor:
    replicas: 1
    persistentVolume: { size: 2Gi }
    resources: { requests: { cpu: 50m, memory: 128Mi } }
  querier:
    replicas: 1
    resources: { requests: { cpu: 100m, memory: 128Mi } }
  query_frontend:
    replicas: 1
    resources: { requests: { cpu: 50m, memory: 64Mi } }
  query_scheduler:
    replicas: 1
    resources: { requests: { cpu: 50m, memory: 64Mi } }
  overrides_exporter:
    # Exposes every tenant's limits as metrics (used by tenant-usage alerts).
    enabled: true
    replicas: 1

# ------------------------------------------------ Object storage (MinIO) -----
# -- Buckets created in the local MinIO. Must match the bucket names in the
# loki / mimir storage settings below.
observabilityBuckets: [loki-chunks, loki-ruler, loki-admin, mimir-blocks, mimir-ruler, mimir-alertmanager]

# Local stand-in for GCS/S3. Disable and point loki/mimir storage at GCS in
# production (see environments/prod-example/hub-gcs.yaml).
minio:
  enabled: false
  fullnameOverride: observability-minio
  mode: standalone
  image:
    repository: docker.io/pgsty/minio
    tag: RELEASE.2026-03-14T12-00-00Z
  mcImage:
    repository: docker.io/pgsty/mc
    tag: RELEASE.2026-03-13T08-57-32Z
  existingSecret: observability-object-storage
  # Buckets are created by templates/hub/minio-buckets.yaml (see
  # `observabilityBuckets`), not by the MinIO chart's post-install hook.
  buckets: []
  persistence:
    size: 10Gi
  resources:
    requests: { cpu: 50m, memory: 256Mi }
  consoleIngress: { enabled: false }

# ------------------------------------------------------------- Grafana -------
grafana:
  enabled: false
  fullnameOverride: grafana
  rbac: { namespaced: true }      # sidecars only watch the hub namespace
  admin:
    existingSecret: observability-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      root_url: http://localhost:3000
    users:
      allow_sign_up: false
      auto_assign_org_role: Viewer
      viewers_can_edit: false
    auth.anonymous:
      enabled: false
    security:
      disable_gravatar: true
      cookie_secure: false        # true behind HTTPS
    # SSO example (Google / Azure AD / generic OAuth) — see docs/authentication.md
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
    dashboards:
      enabled: true
      label: grafana_dashboard
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
        allowUiUpdates: false
    alerts:
      enabled: true
      label: grafana_alert
  # Tenant passwords + hub CA, referenced from datasource provisioning with $__file{}.
  extraSecretMounts:
    - name: tenant-credentials
      secretName: observability-tenant-credentials
      mountPath: /etc/grafana/tenants
      readOnly: true
    - name: hub-ca
      secretName: observability-hub-ca
      mountPath: /etc/grafana/hub-ca
      readOnly: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
  persistence:
    enabled: true
    size: 1Gi
  # The chart's chown init container fails on restart once Grafana has
  # created its subdirectories (it cannot traverse them with its reduced
  # capabilities). fsGroup 472 already gives Grafana ownership of the volume.
  initChownData: { enabled: false }
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  testFramework: { enabled: false }

# --------------------------------------------------------------- Alloy -------
alloy:
  enabled: false
  crds: { create: false }
  controller:
    # "statefulset" (1 replica) pairs with agent.logs.method=api; use
    # "daemonset" with agent.logs.method=file for high-volume log clusters
    # (see environments/prod-example/spoke-media.yaml).
    type: statefulset
    replicas: 1
    # Persistent agent state: log read positions + the metrics WAL. Without it
    # a restarted agent re-sends old log lines (Loki rejects them as
    # "too_far_behind") and loses buffered metrics.
    volumeClaimTemplates:
      - metadata: { name: alloy-data }
        spec:
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 1Gi } }
    volumes:
      extra:
        - name: hub-ca
          secret: { secretName: observability-hub-ca, optional: true }
  alloy:
    configMap:
      create: false
      name: observability-agent-config
      key: config.alloy
    storagePath: /var/lib/alloy
    enableReporting: false
    extraEnv:
      - name: HUB_PASSWORD
        valueFrom: { secretKeyRef: { name: observability-agent-auth, key: password } }
    mounts:
      extra:
        - name: hub-ca
          mountPath: /etc/observability/hub-ca
          readOnly: true
        - name: alloy-data
          mountPath: /var/lib/alloy
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

# -------------------------------------------------- kube-state-metrics -------
kube-state-metrics:
  enabled: false
  prometheusScrape: false        # scraped by Alloy via pod discovery
  resources:
    requests: { cpu: 10m, memory: 32Mi }
