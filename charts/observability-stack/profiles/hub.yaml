# Hub profile: central multi-tenant stack. Combine with the hub's values file
# (in this repo: clusters/aauti-hub-as1-obs-gke/observability/deploy.ps1 does this):
#   helm upgrade --install observability . -n observability \
#     -f profiles/hub.yaml -f ../../clusters/aauti-hub-as1-obs-gke/observability/values.yaml
mode: hub

gateway: { enabled: true }
grafanaAccess: { enabled: true }
alerting: { enabled: true }
k6: { enabled: true }

loki: { enabled: true }
mimir: { enabled: true }
grafana: { enabled: true }
minio: { enabled: true }            # set false when using GCS/S3
alloy: { enabled: true }            # hub self-monitoring -> tenant agent.tenant
kube-state-metrics: { enabled: true }
