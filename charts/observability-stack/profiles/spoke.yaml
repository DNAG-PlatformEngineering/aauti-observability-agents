# Spoke profile: collection agent only. Combine with the spoke's values file
# (in this repo: clusters/<cluster>/observability-agent/deploy.ps1 does this, with
# release / namespace observability-agent-<product><tier> and an existing auth Secret):
#   helm upgrade --install <release> . -n <release> \
#     -f profiles/spoke.yaml -f ../../clusters/<cluster>/observability-agent/values.yaml \
#     --set-file agent.tls.caCert=hub-ca.crt
mode: spoke

networkPolicy: { enabled: false }
alloy: { enabled: true }
kube-state-metrics: { enabled: true }
