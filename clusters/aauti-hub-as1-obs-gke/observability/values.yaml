# Observability backends on aauti-hub-as1-obs-gke (namespace "observability").
# Chart: ../../../charts/observability-stack (hub mode), layered on its
# profiles/hub.yaml.
#
# - Object storage: in-cluster MinIO (no GCS buckets yet).
# - Grafana is NOT part of this release; it runs standalone in namespace
#   "grafana" (../grafana). No datasources are linked yet.
# - Loki + Mimir are reachable only through the authenticating gateway
#   (ClusterIP, not exposed outside the cluster yet).

cluster:
  name: aauti-hub-as1-obs-gke
  environment: prod

agent:
  tenant: platform          # hub self-monitoring
  namespaces: []            # whole hub cluster

# One tenant per product; its clusters are told apart by the cluster /
# environment labels the agents attach (see ../../aauti-jitsi-nonprod-gke).
tenants:
  jitsi:
    title: Jitsi
    # Spokes: aauti-jitsi-nonprod-gke (environment nonprod). Sized from its
    # Prometheus (~90k series incl. control plane, ~3.4k samples/s); the agent
    # sends a filtered subset, so these leave >3x headroom.
    dashboards: [cluster-health, resource-usage, workloads-logs]
    logs:
      retention: 336h        # 14d
      limits: { ingestion_rate_mb: 8, ingestion_burst_size_mb: 16, max_global_streams_per_user: 5000 }
    metrics:
      retention: 720h        # 30d
      limits: { ingestion_rate: 30000, ingestion_burst_size: 300000, max_global_series_per_user: 150000 }
  media:
    title: Media
    # Spokes: aauti-media-nonprod-gke (us-central1, environment dev). Cluster
    # is still empty (no workloads yet); same limits as jitsi until there is
    # real volume to size from.
    dashboards: [cluster-health, resource-usage, workloads-logs]
    logs:
      retention: 336h        # 14d
      limits: { ingestion_rate_mb: 8, ingestion_burst_size_mb: 16, max_global_streams_per_user: 5000 }
    metrics:
      retention: 720h        # 30d
      limits: { ingestion_rate: 30000, ingestion_burst_size: 300000, max_global_series_per_user: 150000 }
  platform:
    title: Platform
    dashboards: [cluster-health, resource-usage, workloads-logs, tenant-usage]
    logs:
      retention: 336h        # 14d
      limits: { ingestion_rate_mb: 10, ingestion_burst_size_mb: 20, max_global_streams_per_user: 5000 }
    metrics:
      retention: 720h        # 30d
      limits: { ingestion_rate: 50000, ingestion_burst_size: 500000, max_global_series_per_user: 300000 }

# Grafana is managed separately (../grafana).
grafana: { enabled: false }
grafanaAccess: { enabled: false }
alerting: { enabled: false }
k6: { enabled: true, tenant: platform }   # no tests defined yet; tenant is temporary

gateway:
  service: { type: ClusterIP }

# Every pod must run on the dedicated node pool (tainted workload=observability).
scheduling: &sched
  nodeSelector: { cloud.google.com/gke-nodepool: observability }
  tolerations:
    - { key: workload, operator: Equal, value: observability, effect: NoSchedule }

minio:
  <<: *sched
  postJob: *sched
  persistence: { size: 50Gi, storageClass: standard-rwo }
  resources:
    requests: { cpu: 100m, memory: 512Mi }

loki:
  singleBinary:
    <<: *sched
    persistence: { size: 20Gi, storageClass: standard-rwo }
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { memory: 2Gi }

mimir:
  distributor: *sched
  ingester:
    <<: *sched
    persistentVolume: { size: 20Gi, storageClass: standard-rwo }
    resources: { requests: { cpu: 200m, memory: 1Gi } }
  store_gateway:
    <<: *sched
    persistentVolume: { size: 10Gi, storageClass: standard-rwo }
  compactor:
    <<: *sched
    persistentVolume: { size: 10Gi, storageClass: standard-rwo }
  querier: *sched
  query_frontend: *sched
  query_scheduler: *sched
  overrides_exporter: *sched

alloy:
  controller: *sched

kube-state-metrics: *sched
