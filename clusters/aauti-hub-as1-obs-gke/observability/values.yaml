# Observability backends on aauti-hub-as1-obs-gke (namespace "observability").
# Chart: ../../../charts/observability-stack (hub mode), layered on its
# profiles/hub.yaml.
#
# - Object storage: in-cluster MinIO (no GCS buckets yet).
# - Grafana is NOT part of this release; it runs standalone in namespace
#   "grafana" (../grafana), with a Loki + Mimir datasource pair per tenant.
# - Loki + Mimir are reachable only through the authenticating gateway:
#   ClusterIP for Grafana in-cluster, plus the internal LB 10.40.16.10 for
#   spokes over VPC peering (gateway-internal-lb.yaml). Nothing is public.

cluster:
  name: aauti-hub-as1-obs-gke
  environment: prod
  product: aauti-hub          # `product` label (single Loki / Mimir datasource in Grafana)

agent:
  tenant: aauti-hub         # hub self-monitoring
  namespaces: []            # whole hub cluster
  envLabel: { enabled: true }   # `env` = `environment`

# One tenant per product and tier: <product>-nonprod and <product>-prod (prod
# is kept 30d, nonprod 7d / 10d; Mimir has one metrics retention per tenant).
# jitsi-nonprod / media-nonprod / platform-nonprod were jitsi / media /
# platform-app until 2026-10-06. Clusters within a
# tenant are told apart by the cluster / environment labels the agents attach
# (see ../../aauti-jitsi-nonprod-gke).
tenants:
  jitsi-nonprod:
    title: Jitsi-nonprod
    # Spokes: aauti-jitsi-nonprod-gke (environment shared; log lines naming a
    # meeting room get that room's dev / qa / demo / sandbox). Sized from its
    # Prometheus (~90k series incl. control plane, ~3.4k samples/s); the agent
    # sends a filtered subset, so these leave >3x headroom.
    dashboards: [cluster-health, resource-usage, workloads-logs]
    # Retention policy: all Jitsi data (every environment) 7 days.
    logs:
      retention: 168h        # 7d
      limits: { ingestion_rate_mb: 8, ingestion_burst_size_mb: 16, max_global_streams_per_user: 5000 }
    metrics:
      retention: 168h        # 7d
      limits: { ingestion_rate: 30000, ingestion_burst_size: 300000, max_global_series_per_user: 150000 }
  jitsi-prod:
    title: Jitsi-prod
    # Spokes: aauti-jitsi-prod-gke (video.aauti.com, environment prod). Own
    # tenant because prod is kept 30d. Same limits as jitsi-nonprod until there
    # is real volume to size from.
    dashboards: [cluster-health, resource-usage, workloads-logs]
    # Retention policy: prod 30 days, logs and metrics.
    logs:
      retention: 720h        # 30d
      limits: { ingestion_rate_mb: 8, ingestion_burst_size_mb: 16, max_global_streams_per_user: 5000 }
    metrics:
      retention: 720h        # 30d
      limits: { ingestion_rate: 30000, ingestion_burst_size: 300000, max_global_series_per_user: 150000 }
  media-nonprod:
    title: Media-nonprod
    # Spokes: aauti-media-nonprod-as1-gke (dev, qa, demo, sandbox; ~34 app
    # pods). Same limits as jitsi-nonprod until there is real volume to size from.
    dashboards: [cluster-health, resource-usage, workloads-logs]
    # Retention policy: dev + sandbox 7 days, qa + demo 10 days.
    # Logs: per environment (Loki retention_stream); everything else, incl.
    # environment "shared" (kube-system, aauti-media-events, media-gateway), 7d.
    # Metrics: Mimir only supports one retention per tenant, so 10d for all
    # environments (qa / demo need 10d; dev / sandbox metrics are kept 10d too).
    logs:
      retention: 168h        # 7d: dev, sandbox, shared
      streamRetention:
        - { selector: '{environment=~"qa|demo"}', priority: 1, period: 240h }   # 10d
      limits: { ingestion_rate_mb: 8, ingestion_burst_size_mb: 16, max_global_streams_per_user: 5000 }
    metrics:
      retention: 240h        # 10d
      limits: { ingestion_rate: 30000, ingestion_burst_size: 300000, max_global_series_per_user: 150000 }
  media-prod:
    title: Media-prod
    # Spokes: aauti-media-prod-as1-gke (environment prod). Own tenant, not
    # "media-nonprod", because Mimir has one metrics retention per tenant and prod
    # needs 30d while media nonprod keeps 7d / 10d. Same limits as media-nonprod until
    # there is real volume to size from.
    dashboards: [cluster-health, resource-usage, workloads-logs]
    # Retention policy: prod 30 days, logs and metrics.
    logs:
      retention: 720h        # 30d
      limits: { ingestion_rate_mb: 8, ingestion_burst_size_mb: 16, max_global_streams_per_user: 5000 }
    metrics:
      retention: 720h        # 30d
      limits: { ingestion_rate: 30000, ingestion_burst_size: 300000, max_global_series_per_user: 150000 }
  platform-nonprod:
    title: Platform-nonprod
    # Spokes: aauti-platform-nonprod-as1-gke (11 apps x dev, qa, demo, sandbox;
    # ~65 app pods).
    dashboards: [cluster-health, resource-usage, workloads-logs]
    # Retention policy: dev + sandbox 7 days, qa + demo 10 days (same as media-nonprod).
    # Logs per environment; "shared" (kube-system, platform-gateway) 7d.
    # Metrics: one retention per tenant in Mimir, so 10d for all.
    logs:
      retention: 168h        # 7d: dev, sandbox, shared
      streamRetention:
        - { selector: '{environment=~"qa|demo"}', priority: 1, period: 240h }   # 10d
      limits: { ingestion_rate_mb: 10, ingestion_burst_size_mb: 20, max_global_streams_per_user: 10000 }
    metrics:
      retention: 240h        # 10d
      limits: { ingestion_rate: 50000, ingestion_burst_size: 500000, max_global_series_per_user: 300000 }
  # Hub self-monitoring (this cluster's Alloy). Was "platform" until
  # 2026-10-06; renamed so it isn't confused with the platform app clusters.
  aauti-hub:
    title: Aauti-hub
    dashboards: [cluster-health, resource-usage, workloads-logs, tenant-usage]
    logs:
      retention: 336h        # 14d
      limits: { ingestion_rate_mb: 10, ingestion_burst_size_mb: 20, max_global_streams_per_user: 5000 }
    metrics:
      retention: 720h        # 30d
      limits: { ingestion_rate: 50000, ingestion_burst_size: 500000, max_global_series_per_user: 300000 }
  # The chart's default tenant; removed (renamed to aauti-hub above). Its old
  # data stays in MinIO, unreadable, until the default retention deletes it.
  platform: null

# Grafana is managed separately (../grafana).
grafana: { enabled: false }
grafanaAccess: { enabled: false }
alerting: { enabled: false }
k6: { enabled: true, tenant: aauti-hub }   # no tests defined yet; tenant is temporary

gateway:
  service: { type: ClusterIP }
  # Read-only user "grafana-reader" for Grafana's single "Loki" / "Mimir"
  # datasources: the gateway pins it to all tenants (federation), no push.
  reader: { enabled: true }

# Every pod must run on the dedicated node pool (tainted workload=observability).
scheduling: &sched
  nodeSelector: { cloud.google.com/gke-nodepool: observability }
  tolerations:
    - { key: workload, operator: Equal, value: observability, effect: NoSchedule }

minio:
  <<: *sched
  postJob: *sched
  persistence: { size: 50Gi, storageClass: standard-rwo }
  resources:
    requests: { cpu: 100m, memory: 512Mi }

loki:
  loki:
    structuredConfig:
      querier: { multi_tenant_queries_enabled: true }   # for gateway.reader
  singleBinary:
    <<: *sched
    persistence: { size: 20Gi, storageClass: standard-rwo }
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { memory: 2Gi }

mimir:
  mimir:
    structuredConfig:
      tenant_federation: { enabled: true }              # for gateway.reader
  distributor: *sched
  ingester:
    <<: *sched
    persistentVolume: { size: 20Gi, storageClass: standard-rwo }
    resources: { requests: { cpu: 200m, memory: 1Gi } }
  store_gateway:
    <<: *sched
    persistentVolume: { size: 10Gi, storageClass: standard-rwo }
  compactor:
    <<: *sched
    persistentVolume: { size: 10Gi, storageClass: standard-rwo }
  querier: *sched
  query_frontend: *sched
  query_scheduler: *sched
  overrides_exporter: *sched

alloy:
  controller: *sched

kube-state-metrics: *sched
