# Grafana-managed alert rules for aauti-media-prod-as1-gke (tenant "media-prod").
# Provisioned by ../deploy.ps1 (ConfigMap grafana-alerting-rules, mounted into
# /etc/grafana/provisioning/alerting). Edit here, then run deploy.ps1; rules
# are read-only in the Grafana UI.
#
# - Every query is pinned to cluster="aauti-media-prod-as1-gke", and every
#   alert carries environment / namespace (plus pod / container / node where
#   it applies), so a notification says exactly where the problem is.
# - Labels: severity (critical | warning), tenant, cluster. Routing is in the
#   notification policy (grafana-alerting-notify, rendered by deploy.ps1).
# - Annotations use {{ .Labels.x }} / {{ .Value }} rather than the dollar-sign
#   aliases, so the files never contain a dollar sign (provisioning would treat
#   it as an environment variable). Keep it that way when adding rules.
# - Prod tier (tenant media-prod, 30d retention). Same rules as
#   media-nonprod.yaml; environment is "prod" for everything on this cluster.
#   Prod alert routing: today there is one notification policy (contact point
#   email-nonprod); give prod its own contact point before SMTP goes live.
# - HPA rule skips HPAs with min = max (they can never scale).
# - No generic "target down" rule; agent health is covered by "metrics
#   stopped" / "logs stopped".
apiVersion: 1
groups:
  - orgId: 1
    name: Media-prod
    folder: Alerts
    interval: 1m
    rules:
      # ------------------------------------------------------------------
      # Workloads
      # ------------------------------------------------------------------
      - uid: media-prod-pod-crashloop
        title: Pod crash looping
        condition: C
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: max by (environment, namespace, pod, container) (kube_pod_container_status_waiting_reason{cluster="aauti-media-prod-as1-gke", reason="CrashLoopBackOff"})
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning, tenant: media-prod, cluster: aauti-media-prod-as1-gke }
        annotations:
          summary: "{{ .Labels.namespace }}/{{ .Labels.pod }} ({{ .Labels.container }}) is in CrashLoopBackOff"
          description: "Container keeps crashing in environment {{ .Labels.environment }}. Check its logs in Grafana (Explore: Loki, cluster aauti-media-prod-as1-gke) and the last termination reason."

      - uid: media-prod-image-pull
        title: Image pull failing
        condition: C
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: max by (environment, namespace, pod, container, reason) (kube_pod_container_status_waiting_reason{cluster="aauti-media-prod-as1-gke", reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"})
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, tenant: media-prod, cluster: aauti-media-prod-as1-gke }
        annotations:
          summary: "{{ .Labels.namespace }}/{{ .Labels.pod }} cannot pull its image ({{ .Labels.reason }})"
          description: "Wrong tag, missing image or registry permissions, environment {{ .Labels.environment }}."

      - uid: media-prod-oomkilled
        title: Container OOMKilled
        condition: C
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              refId: A
              instant: true
              expr: >-
                sum by (environment, namespace, pod, container) (increase(kube_pod_container_status_restarts_total{cluster="aauti-media-prod-as1-gke"}[15m]))
                and on (namespace, pod, container)
                max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{cluster="aauti-media-prod-as1-gke", reason="OOMKilled"}) == 1
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: warning, tenant: media-prod, cluster: aauti-media-prod-as1-gke }
        annotations:
          summary: "{{ .Labels.namespace }}/{{ .Labels.pod }} ({{ .Labels.container }}) was OOMKilled"
          description: "The container hit its memory limit and was restarted, environment {{ .Labels.environment }}. Raise the limit or fix the leak."

      - uid: media-prod-frequent-restarts
        title: Container restarting frequently
        condition: C
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: { from: 3600, to: 0 }
            model:
              refId: A
              instant: true
              expr: sum by (environment, namespace, pod, container) (increase(kube_pod_container_status_restarts_total{cluster="aauti-media-prod-as1-gke"}[1h]))
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [3] } }] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: warning, tenant: media-prod, cluster: aauti-media-prod-as1-gke }
        annotations:
          summary: "{{ .Labels.namespace }}/{{ .Labels.pod }} ({{ .Labels.container }}) restarted {{ .Value }} times in 1h"
          description: "More than 3 restarts in the last hour, environment {{ .Labels.environment }}."

      - uid: media-prod-deployment-unavailable
        title: Deployment replicas unavailable
        condition: C
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: max by (environment, namespace, deployment) (kube_deployment_status_replicas_unavailable{cluster="aauti-media-prod-as1-gke"})
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, tenant: media-prod, cluster: aauti-media-prod-as1-gke }
        annotations:
          summary: "{{ .Labels.namespace }}/{{ .Labels.deployment }} has {{ .Value }} unavailable replica(s)"
          description: "Unavailable for 15 minutes in environment {{ .Labels.environment }} (failed rollout, crashing pods or no capacity)."

      - uid: media-prod-pod-not-running
        title: Pod stuck Pending or Unknown
        condition: C
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: max by (environment, namespace, pod, phase) (kube_pod_status_phase{cluster="aauti-media-prod-as1-gke", phase=~"Pending|Unknown"})
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, tenant: media-prod, cluster: aauti-media-prod-as1-gke }
        annotations:
          summary: "{{ .Labels.namespace }}/{{ .Labels.pod }} has been {{ .Labels.phase }} for 15m"
          description: "Usually unschedulable (CPU / memory requests, node pool max size) or a volume that can't attach. Environment {{ .Labels.environment }}."

      - uid: media-prod-hpa-maxed
        title: HPA at max replicas
        condition: C
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: >-
                max by (environment, namespace, horizontalpodautoscaler) (kube_horizontalpodautoscaler_status_current_replicas{cluster="aauti-media-prod-as1-gke"})
                >= on (namespace, horizontalpodautoscaler) group_left
                max by (namespace, horizontalpodautoscaler) (kube_horizontalpodautoscaler_spec_max_replicas{cluster="aauti-media-prod-as1-gke"})
                and on (namespace, horizontalpodautoscaler)
                (max by (namespace, horizontalpodautoscaler) (kube_horizontalpodautoscaler_spec_max_replicas{cluster="aauti-media-prod-as1-gke"})
                 > max by (namespace, horizontalpodautoscaler) (kube_horizontalpodautoscaler_spec_min_replicas{cluster="aauti-media-prod-as1-gke"}))
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, tenant: media-prod, cluster: aauti-media-prod-as1-gke }
        annotations:
          summary: "{{ .Labels.namespace }}/{{ .Labels.horizontalpodautoscaler }} is pinned at its max replicas"
          description: "The autoscaler can't add more pods (at maxReplicas for 15m), environment {{ .Labels.environment }}."

      - uid: media-prod-memory-near-limit
        title: Container memory near limit
        condition: C
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: >-
                max by (environment, namespace, pod, container) (container_memory_working_set_bytes{cluster="aauti-media-prod-as1-gke", container!="", container!="POD"})
                / on (namespace, pod, container) group_left
                max by (namespace, pod, container) (kube_pod_container_resource_limits{cluster="aauti-media-prod-as1-gke", resource="memory"})
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0.9] } }] }
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: warning, tenant: media-prod, cluster: aauti-media-prod-as1-gke }
        annotations:
          summary: "{{ .Labels.namespace }}/{{ .Labels.pod }} ({{ .Labels.container }}) uses {{ humanizePercentage .Value }} of its memory limit"
          description: "Above 90% for 15 minutes; an OOMKill is likely next. Environment {{ .Labels.environment }}."

      - uid: media-prod-pvc-almost-full
        title: Persistent volume almost full
        condition: C
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: >-
                max by (environment, namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{cluster="aauti-media-prod-as1-gke"})
                / on (namespace, persistentvolumeclaim) group_left
                max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{cluster="aauti-media-prod-as1-gke"})
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0.85] } }] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, tenant: media-prod, cluster: aauti-media-prod-as1-gke }
        annotations:
          summary: "PVC {{ .Labels.namespace }}/{{ .Labels.persistentvolumeclaim }} is {{ humanizePercentage .Value }} full"
          description: "Above 85%. Expand the volume or clean up, environment {{ .Labels.environment }}."

      # ------------------------------------------------------------------
      # Nodes
      # ------------------------------------------------------------------
      - uid: media-prod-node-not-ready
        title: Node not ready
        condition: C
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: max by (node) (kube_node_status_condition{cluster="aauti-media-prod-as1-gke", condition="Ready", status="true"})
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: lt, params: [1] } }] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, tenant: media-prod, cluster: aauti-media-prod-as1-gke }
        annotations:
          summary: "Node {{ .Labels.node }} is NotReady"
          description: "Pods on this node are not being served. Check the node in GKE (aauti-media-prod, aauti-media-prod-as1-gke)."

      - uid: media-prod-node-pressure
        title: Node under resource pressure
        condition: C
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: max by (node, condition) (kube_node_status_condition{cluster="aauti-media-prod-as1-gke", condition=~"MemoryPressure|DiskPressure|PIDPressure", status="true"})
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: warning, tenant: media-prod, cluster: aauti-media-prod-as1-gke }
        annotations:
          summary: "Node {{ .Labels.node }} reports {{ .Labels.condition }}"
          description: "The kubelet will start evicting pods from this node."

      # ------------------------------------------------------------------
      # Logs
      # ------------------------------------------------------------------
      - uid: media-prod-error-logs
        title: Error log spike
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange: { from: 300, to: 0 }
            queryType: instant
            model:
              refId: A
              queryType: instant
              expr: sum by (environment, namespace) (count_over_time({cluster="aauti-media-prod-as1-gke", namespace=~"aauti-media-.+"} | detected_level=~"error|fatal|critical" [5m]))
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [50] } }] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: warning, tenant: media-prod, cluster: aauti-media-prod-as1-gke }
        annotations:
          summary: "{{ .Labels.namespace }} logged {{ .Value }} error lines in 5m"
          description: "More than 50 error/fatal lines per 5 minutes for 10 minutes, environment {{ .Labels.environment }}. Baseline 2026-10-09..12: no error-level lines in the aauti-media-*-prod namespaces."

      # ------------------------------------------------------------------
      # Agent / pipeline health (no data reaching the hub)
      # ------------------------------------------------------------------
      - uid: media-prod-metrics-stopped
        title: Metrics stopped arriving
        condition: C
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: { from: 900, to: 0 }
            model:
              refId: A
              instant: true
              expr: absent_over_time(up{cluster="aauti-media-prod-as1-gke", job="integrations/kubernetes/kubelet"}[10m])
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: gt, params: [0] } }] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: critical, tenant: media-prod, cluster: aauti-media-prod-as1-gke }
        annotations:
          summary: "No metrics from aauti-media-prod-as1-gke for 10m"
          description: "The agent (namespace observability-agent-mediaprod) is down or can't reach the hub gateway (network, TLS, password). Run observability-agent/verify.ps1."

      - uid: media-prod-logs-stopped
        title: Logs stopped arriving
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange: { from: 600, to: 0 }
            queryType: instant
            model:
              refId: A
              queryType: instant
              expr: sum(count_over_time({cluster="aauti-media-prod-as1-gke"}[10m]))
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: A, conditions: [{ evaluator: { type: lt, params: [1] } }] }
        # No result at all means no logs, so "no data" fires too.
        noDataState: Alerting
        execErrState: Error
        for: 5m
        labels: { severity: critical, tenant: media-prod, cluster: aauti-media-prod-as1-gke }
        annotations:
          summary: "No logs from aauti-media-prod-as1-gke for 10m"
          description: "The agent (namespace observability-agent-mediaprod) is down or can't reach the hub gateway (network, TLS, password). Run observability-agent/verify.ps1."
