# Standalone Grafana for aauti-hub-as1-obs-gke, served at https://grafana.aauti.ai
# Chart: grafana/grafana 10.5.15. Datasources: "Loki" + "Mimir" across all
# tenants (Mimir is the default); no per-tenant datasources
# (aauti-hub, jitsi-nonprod, media-nonprod, media-prod, platform-nonprod). Dashboards: folder per
# tenant (Jitsi-nonprod, Media-nonprod, Media-prod, Platform-nonprod).
#
# Exposure: GKE Ingress (external HTTPS LB) + Google-managed certificate on the
# reserved global static IP "aauti-hub-vpc-as1-grafana-ip" (8.233.134.60).

replicas: 1

admin:
  # Created by deploy.ps1 with a random password; never stored in this repo.
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

persistence:
  enabled: true
  type: pvc
  storageClassName: standard-rwo
  size: 10Gi

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 512Mi }

# Run on the dedicated "observability" node pool (tainted workload=observability).
nodeSelector:
  cloud.google.com/gke-nodepool: observability
tolerations:
  - { key: workload, operator: Equal, value: observability, effect: NoSchedule }

grafana.ini:
  server:
    domain: grafana.aauti.ai
    root_url: https://grafana.aauti.ai
  security:
    cookie_secure: true
    disable_gravatar: true
  users:
    allow_sign_up: false
    auto_assign_org_role: Viewer
  auth.anonymous:
    enabled: false
  analytics:
    reporting_enabled: false
    check_for_updates: false
  # Alert emails (Outlook / Microsoft 365). Login and From address come from
  # Secret grafana-smtp via env (below). Microsoft 365 SMTP AUTH must be
  # allowed for that mailbox; otherwise point host at an SMTP relay on 587
  # (GCP blocks outbound port 25).
  smtp:
    enabled: true
    host: smtp.office365.com:587
    startTLS_policy: MandatoryStartTLS
    from_name: Aauti Grafana

# SMTP credentials, created by deploy.ps1 (-SmtpUser). optional: Grafana still
# starts before the Secret exists; it just can't send mail.
envValueFrom:
  GF_SMTP_USER:
    secretKeyRef: { name: grafana-smtp, key: user, optional: true }
  GF_SMTP_FROM_ADDRESS:
    secretKeyRef: { name: grafana-smtp, key: user, optional: true }
  GF_SMTP_PASSWORD:
    secretKeyRef: { name: grafana-smtp, key: password, optional: true }

# Loki + Mimir of tenant "aauti-hub" (hub self-monitoring), through the observability gateway (HTTPS,
# private CA, basic auth). Password and CA come from Secret
# grafana-hub-datasource, copied from namespace "observability" by deploy.ps1.
extraSecretMounts:
  - name: hub-datasource
    secretName: grafana-hub-datasource
    mountPath: /etc/grafana/hub
    readOnly: true

datasources:
  datasources.yaml:
    apiVersion: 1
    # Removed datasources: the per-tenant pairs (2026-10-06; everything uses the
    # federated "Loki" / "Mimir" now) and the names before the tenant renames.
    deleteDatasources:
      - { name: Loki – Platform, orgId: 1 }
      - { name: Mimir – Platform, orgId: 1 }
      - { name: Loki – Jitsi, orgId: 1 }
      - { name: Mimir – Jitsi, orgId: 1 }
      - { name: Loki – Media, orgId: 1 }
      - { name: Mimir – Media, orgId: 1 }
      - { name: Loki – Platform-app, orgId: 1 }
      - { name: Mimir – Platform-app, orgId: 1 }
      - { name: Loki – Aauti-hub, orgId: 1 }
      - { name: Mimir – Aauti-hub, orgId: 1 }
      - { name: Loki – Jitsi-nonprod, orgId: 1 }
      - { name: Mimir – Jitsi-nonprod, orgId: 1 }
      - { name: Loki – Media-nonprod, orgId: 1 }
      - { name: Mimir – Media-nonprod, orgId: 1 }
      - { name: Loki – Media-prod, orgId: 1 }
      - { name: Mimir – Media-prod, orgId: 1 }
      - { name: Loki – Platform-nonprod, orgId: 1 }
      - { name: Mimir – Platform-nonprod, orgId: 1 }
    datasources:
      # One datasource per signal across ALL tenants (Loki / Mimir tenant
      # federation). User grafana-reader is read-only; the gateway pins its
      # X-Scope-OrgID to every tenant, so no header is sent here. Filter with
      # the labels product / env / cluster / namespace / app / pod / container
      # (__tenant_id__ is added by Loki / Mimir).
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: https://observability-gateway.observability.svc:443
        basicAuth: true
        basicAuthUser: grafana-reader
        editable: false
        jsonData:
          tlsAuthWithCACert: true
          maxLines: 1000
        secureJsonData:
          basicAuthPassword: $__file{/etc/grafana/hub/grafana-reader}
          tlsCACert: $__file{/etc/grafana/hub/ca.crt}
      - name: Mimir
        uid: mimir
        type: prometheus
        access: proxy
        url: https://observability-gateway.observability.svc:443/prometheus
        basicAuth: true
        basicAuthUser: grafana-reader
        isDefault: true
        editable: false
        jsonData:
          tlsAuthWithCACert: true
          prometheusType: Mimir
          timeInterval: 60s
        secureJsonData:
          basicAuthPassword: $__file{/etc/grafana/hub/grafana-reader}
          tlsCACert: $__file{/etc/grafana/hub/ca.crt}

# Dashboards as code: one provider + folder per tenant. deploy.ps1 renders the
# ConfigMap grafana-dashboards-<tenant> from charts/observability-stack/dashboards
# (shared templates listed in the tenant's `dashboards` + dashboards/tenants/<tenant>/).
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: jitsi-nonprod
        orgId: 1
        folder: Jitsi-nonprod
        type: file
        disableDeletion: true
        editable: false
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/jitsi-nonprod
      - name: media-nonprod
        orgId: 1
        folder: Media-nonprod
        type: file
        disableDeletion: true
        editable: false
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/media-nonprod
      - name: media-prod
        orgId: 1
        folder: Media-prod
        type: file
        disableDeletion: true
        editable: false
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/media-prod
      - name: platform-nonprod
        orgId: 1
        folder: Platform-nonprod
        type: file
        disableDeletion: true
        editable: false
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/platform-nonprod
dashboardsConfigMaps:
  jitsi-nonprod: grafana-dashboards-jitsi-nonprod
  media-nonprod: grafana-dashboards-media-nonprod
  media-prod: grafana-dashboards-media-prod
  platform-nonprod: grafana-dashboards-platform-nonprod

# Alerting as code: rule files from alerting/*.yaml (ConfigMap
# grafana-alerting-rules) plus the email contact point + notification policy
# (Secret grafana-alerting-notify, holds the recipients), both rendered by
# deploy.ps1 and projected into one provisioning directory. Not the chart's
# `alerting:` value: that is run through tpl, which breaks {{ .Labels.x }}.
extraContainerVolumes:
  - name: alerting
    projected:
      sources:
        - configMap: { name: grafana-alerting-rules }
        - secret:
            name: grafana-alerting-notify
            items: [{ key: notify.yaml, path: notify.yaml }]   # not the raw alert-emails key
extraVolumeMounts:
  - name: alerting
    mountPath: /etc/grafana/provisioning/alerting
    readOnly: true

sidecar:
  datasources: { enabled: false }
  dashboards: { enabled: false }

service:
  type: ClusterIP
  port: 80
  annotations:
    cloud.google.com/neg: '{"ingress": true}'

ingress:
  enabled: true
  ingressClassName: ""   # GKE uses the annotation below, not an IngressClass
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: aauti-hub-vpc-as1-grafana-ip
    networking.gke.io/managed-certificates: grafana-cert
    networking.gke.io/v1beta1.FrontendConfig: grafana-frontend
  hosts: [grafana.aauti.ai]
  path: /
  pathType: Prefix

extraObjects:
  - apiVersion: networking.gke.io/v1
    kind: ManagedCertificate
    metadata:
      name: grafana-cert
    spec:
      domains: [grafana.aauti.ai]
  - apiVersion: networking.gke.io/v1beta1
    kind: FrontendConfig
    metadata:
      name: grafana-frontend
    spec:
      redirectToHttps:
        enabled: true
        responseCodeName: MOVED_PERMANENTLY_DEFAULT
